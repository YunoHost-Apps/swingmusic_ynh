#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "swingmusic"
name = "Swing Music"
description.en = "Beautiful music player for your local audio files"
description.fr = "Magnifique lecteur de musique pour vos fichiers audios locaux"

version = "2.1.3~ynh1"

maintainers = ["Thovi98"]

[upstream]
license = "MIT"
website = "https://swingmx.com/"
admindoc = "https://swingmx.com/guide/getting-started.html"
code = "https://github.com/swingmx/swingmusic"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true

ldap = false
sso = false

disk = "10M"
ram.build = "100M"
ram.runtime = "100M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources.main]
    amd64.url = "https://github.com/swingmx/swingmusic/releases/download/v2.1.3/swingmusic_linux_x86_64"
    amd64.sha256 = "72dc8cee186817e3080962dd3d743eeef3e542fa75e2a54e1abb457f970e7e18"

    arm64.url = "https://github.com/swingmx/swingmusic/releases/download/v2.1.3/swingmusic_linux_aarch64"
    arm64.sha256 = "6567146156d8022e1de7a01d7be7bad8b10472f8eb53d67c343706ddb61b6d9e"

    extract = false
    rename = "swingmusic"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "swingmusic_linux_x86_64$"
    autoupdate.asset.arm64 = "swingmusic_linux_aarch64$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = ["ffmpeg", "libavcodec-extra",]
