#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "swingmusic"
name = "Swing Music"
description.en = "Beautiful music player for your local audio files"
description.fr = "Magnifique lecteur de musique pour vos fichiers audios locaux"

version = "2.0.9~ynh2"

maintainers = ["Thovi98"]

[upstream]
license = "MIT"
website = "https://swingmx.com/"
admindoc = "https://swingmx.com/guide/getting-started.html"
code = "https://github.com/swingmx/swingmusic"

[integration]
yunohost = ">= 12.0.9"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true

ldap = false

sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources.main]
    amd64.url = "https://github.com/swingmx/swingmusic/releases/download/v2.0.9/swingmusic_linux_amd64"
    amd64.sha256 = "1b7bc48f17e43f4d64d2d8c51ca600ae8c0975609b536aefdaac48a15a8ec1a5"

    arm64.url = "https://github.com/swingmx/swingmusic/releases/download/v2.0.9/swingmusic_linux_pi5"
    arm64.sha256 = "553602d920248198072a4c64592f1b7862ee6d7a4fe4e8313f0fc64a3faae176"

    extract = false
    rename = "swingmusic"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "swingmusic_linux_amd64$"
    autoupdate.asset.arm64 = "swingmusic_linux_pi5$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = ["ffmpeg", "libavcodec-extra",]
